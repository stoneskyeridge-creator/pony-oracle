let pile=[],current=null,busy=false,down=false;const $=id=>document.getElementById(id);function mix(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}function reset(){if(busy)return;pile=cards.map((_,i)=>i);mix(pile);current=null;showDeck()}function count(){$('count').textContent=pile.length+' of 44 cards remain in the deck'}
const table = $('table-scene');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
let revealTimer;
let readingTimer;

function tableDuration(milliseconds) {
  return reducedMotion.matches ? 0 : milliseconds;
}

function showDeck() {
  clearTimeout(revealTimer);
  clearTimeout(readingTimer);
  table.classList.remove('is-revealed','is-dragging','is-shuffling');
  $('stage').classList.remove('hidden');
  $('result').innerHTML = '';
  $('shuffle').classList.remove('hidden');
  $('flip').classList.add('hidden');
  $('next').classList.add('hidden');
  $('shuffle').disabled = !pile.length;
  setDeckHint();
  count();
}

function setDeckHint() {
  $('hint').textContent = pile.length
    ? 'Move the deck with a touch or tap Shuffle & Drop.'
    : 'All 44 cards have been drawn. Gather them to begin again.';
}

function drop() {
  if (busy || !pile.length || $('stage').classList.contains('hidden')) return;
  busy = true;
  $('shuffle').disabled = true;
  table.classList.remove('is-dragging');
  table.classList.add('is-shuffling');
  $('deck').style.transform = '';
  $('deck').classList.add('shuffling');

  setTimeout(() => {
    table.classList.remove('is-shuffling');
    $('deck').classList.remove('shuffling');
    mix(pile);
    current = pile.pop();
    $('stage').classList.add('hidden');
    $('shuffle').classList.add('hidden');
    const card = cards[current];
    $('result').innerHTML = `<div class="table-draw">
      <div class="table-card is-landing">
        <div class="table-turn">
          <div class="table-turn-side table-turn-back" aria-hidden="true"></div>
          <div class="table-turn-side table-turn-front" aria-hidden="true">${face(card, false)}</div>
        </div>
      </div>
      <aside class="table-reading hidden">${reflection(card)}</aside>
    </div>`;
    $('hint').textContent = 'A card is landing on the table.';
    count();
    setTimeout(() => {
      document.querySelector('.table-card').classList.remove('is-landing');
      $('flip').classList.remove('hidden');
      $('hint').textContent = 'Your card is turning over.';
      revealTimer = setTimeout(flip, tableDuration(230));
    }, tableDuration(560));
  }, tableDuration(560));
}

function reflection(c) {
  return `<p><b>Affirmation</b><br>${c.affirmation}</p>
    <p><b>Reflect</b><br>${c.question}</p>`;
}
function face(c, includeReflection = true){
  return `<article class="face">
    <div class="card-art">
      <img src="${c.image}" alt="${c.name}" width="1024" height="1536">
      <div class="card-copy">
        <h2>${c.theme}</h2>
        <h3>${c.name} · Card ${cards.indexOf(c)+1} / 44</h3>
        <p>${c.meaning}</p>
      </div>
    </div>
    ${includeReflection ? `<div class="card-reflection">${reflection(c)}</div>` : ''}
  </article>`;
}

function flip() {
  const card = $('result').querySelector('.table-card');
  if (!card || card.classList.contains('is-landing') || card.classList.contains('is-flipped')) return;
  clearTimeout(revealTimer);
  $('flip').classList.add('hidden');
  table.classList.add('is-revealed');
  card.classList.add('is-flipped');
  readingTimer = setTimeout(() => {
    card.querySelector('.table-turn-front').removeAttribute('aria-hidden');
    $('result').querySelector('.table-reading').classList.remove('hidden');
    $('next').classList.remove('hidden');
    if (!$('home').classList.contains('hidden')) $('hint').textContent = 'Your oracle card is face-up.';
    busy = false;
  }, tableDuration(680));
}
$('shuffle').onclick = drop;
$('flip').onclick = flip;
$('result').onclick = flip;
$('next').onclick = showDeck;
$('reset').onclick = reset;
$('browse').onclick=()=>{$('home').classList.add('hidden');$('library').classList.remove('hidden');$('hint').textContent='Explore every card in the deck.';$('tiles').innerHTML=cards.map((c,i)=>`<button class="tile" data-i="${i}"><img src="${c.image}" alt="" loading="lazy" decoding="async" width="1024" height="1536"><b>${c.theme}</b><small>${c.name}</small></button>`).join('')};$('tiles').onclick=e=>{let b=e.target.closest('[data-i]');if(b){$('tiles').innerHTML=face(cards[+b.dataset.i])+'<button id="backlist">Back to All Cards</button>';$('backlist').onclick=$('browse').onclick}};
$('close').onclick = () => {
  $('home').classList.remove('hidden');
  $('library').classList.add('hidden');
  if (table.classList.contains('is-revealed')) $('hint').textContent = 'Your oracle card is face-up.';
  else if (!busy) setDeckHint();
};
let dragStart;
$('stage').onpointerdown = event => {
  if (busy || !pile.length || !event.isPrimary) return;
  down = true;
  dragStart = {x:event.clientX, y:event.clientY};
  table.style.setProperty('--hoof-x','0px');
  table.style.setProperty('--hoof-y','0px');
  table.classList.add('is-dragging');
  $('stage').setPointerCapture(event.pointerId);
};
$('stage').onpointermove = event => {
  if (!down || !event.isPrimary) return;
  const x = Math.max(-30, Math.min(30, event.clientX - dragStart.x));
  const y = Math.max(-18, Math.min(18, event.clientY - dragStart.y));
  if (reducedMotion.matches) return;
  $('deck').style.transform = `translate(${x}px,${y}px) rotate(${x/4}deg)`;
  table.style.setProperty('--hoof-x', x + 'px');
  table.style.setProperty('--hoof-y', y + 'px');
};
$('stage').onpointerup = event => {
  if (!down || !event.isPrimary) return;
  down = false;
  drop();
};
$('stage').onpointercancel = () => {
  down = false;
  table.classList.remove('is-dragging');
  $('deck').style.transform = '';
};
reset();

const musicTracks = [{"title": "Moonlit Glade", "src": "music/moonlit-glade.mp3"}, {"title": "Starlight Music Box", "src": "music/starlight-music-box.mp3"}, {"title": "Cozy Cloud Lo-fi", "src": "music/cozy-cloud-lofi.mp3"}, {"title": "Canterlot After Dark", "src": "music/canterlot-after-dark.mp3"}];
const musicAudio = $('music-audio');
const musicToggle = $('music-toggle');
const musicNext = $('music-next');
const musicStatus = $('music-status');
let musicIndex = 0;
let musicRequested = false;
let musicRequest = 0;

function showMusicTrack() {
  const title = musicTracks[musicIndex].title;
  musicNext.textContent = title + ' ↻';
  musicNext.setAttribute('aria-label', 'Next music track. Current track: ' + title);
}

function showMusicState(playing) {
  musicRequested = playing;
  musicToggle.textContent = playing ? 'Stop music' : 'Play music';
}

async function playMusic() {
  const request = ++musicRequest;
  const track = musicTracks[musicIndex];
  musicStatus.textContent = '';
  if (musicAudio.getAttribute('src') !== track.src) musicAudio.src = track.src;
  showMusicState(true);
  try {
    await musicAudio.play();
    if (request === musicRequest) musicStatus.textContent = 'Playing ' + track.title;
  } catch {
    if (request !== musicRequest) return;
    showMusicState(false);
    musicStatus.textContent = 'Music could not start. Tap Play to try again.';
  }
}

musicToggle.addEventListener('click', () => {
  if (!musicRequested) {
    playMusic();
    return;
  }
  ++musicRequest;
  musicAudio.pause();
  musicAudio.currentTime = 0;
  showMusicState(false);
  musicStatus.textContent = 'Music stopped';
});

musicNext.addEventListener('click', () => {
  musicIndex = (musicIndex + 1) % musicTracks.length;
  showMusicTrack();
  if (musicRequested) playMusic();
  else musicStatus.textContent = 'Selected ' + musicTracks[musicIndex].title;
});

showMusicTrack();
</script></body></html>
