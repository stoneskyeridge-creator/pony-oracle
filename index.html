let pile=[],current=null,busy=false,down=false,moves=0;const $=id=>document.getElementById(id);function mix(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}function reset(){if(busy)return;pile=cards.map((_,i)=>i);mix(pile);current=null;showDeck()}function count(){$('count').textContent=pile.length+' of 44 cards remain in the deck'}function showDeck(){$('stage').classList.remove('hidden');$('result').innerHTML='';$('shuffle').classList.remove('hidden');$('flip').classList.add('hidden');$('next').classList.add('hidden');$('shuffle').disabled=!pile.length;$('hint').textContent=pile.length?'Shuffle the deck and let a card find its way out.':'All 44 cards have been drawn. Gather them to begin again.';count()}function drop(){if(busy||!pile.length)return;busy=true;$('deck').classList.add('shuffling');setTimeout(()=>{$('deck').classList.remove('shuffling');mix(pile);current=pile.pop();$('deck').style.transform='';$('stage').classList.add('hidden');$('result').innerHTML='<div class="stage"><div class="deck fall"><div class="back">✦</div></div></div>';$('shuffle').classList.add('hidden');$('flip').classList.remove('hidden');$('hint').textContent='A card has fallen. Tap to reveal it.';count();busy=false},450)}function face(c){

const musicTracks = [{"title": "Moonlit Glade", "src": "music/moonlit-glade.mp3"}, {"title": "Starlight Music Box", "src": "music/starlight-music-box.mp3"}, {"title": "Cozy Cloud Lo-fi", "src": "music/cozy-cloud-lofi.mp3"}, {"title": "Canterlot After Dark", "src": "music/canterlot-after-dark.mp3"}];
const musicAudio = $('music-audio');
const musicToggle = $('music-toggle');
const musicNext = $('music-next');
const musicStatus = $('music-status');
let musicIndex = 0;
let musicRequested = false;
let musicRequest = 0;

function showMusicTrack() {
  const title = musicTracks[musicIndex].title;
  musicNext.textContent = title + ' ↻';
  musicNext.setAttribute('aria-label', 'Next music track. Current track: ' + title);
}

function showMusicState(playing) {
  musicRequested = playing;
  musicToggle.textContent = playing ? 'Stop music' : 'Play music';
}

async function playMusic() {
  const request = ++musicRequest;
  const track = musicTracks[musicIndex];
  musicStatus.textContent = '';
  if (musicAudio.getAttribute('src') !== track.src) musicAudio.src = track.src;
  showMusicState(true);
  try {
    await musicAudio.play();
    if (request === musicRequest) musicStatus.textContent = 'Playing ' + track.title;
  } catch {
    if (request !== musicRequest) return;
    showMusicState(false);
    musicStatus.textContent = 'Music could not start. Tap Play to try again.';
  }
}

musicToggle.addEventListener('click', () => {
  if (!musicRequested) {
    playMusic();
    return;
  }
  ++musicRequest;
  musicAudio.pause();
  musicAudio.currentTime = 0;
  showMusicState(false);
  musicStatus.textContent = 'Music stopped';
});

musicNext.addEventListener('click', () => {
  musicIndex = (musicIndex + 1) % musicTracks.length;
  showMusicTrack();
  if (musicRequested) playMusic();
  else musicStatus.textContent = 'Selected ' + musicTracks[musicIndex].title;
});

showMusicTrack();
</script></body></html>
